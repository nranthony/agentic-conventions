# myclickup pins for this repo — non-secret by design (myclickup ADR-0005).
# Workspace and list IDs are configuration, not secrets: they are worthless
# without a token, and any token holder enumerates them with one API call.
# A TOKEN NEVER BELONGS IN THIS FILE, on any platform.
#
# How this repo uses it → docs/adr/0008-clickup-work-sync.md
#
# Three behaviours, verified against myclickup 0.2.0:
#   key absent entirely -> falls back to the token's FIRST workspace, warning
#   present but empty   -> HTTP 400 "Invalid workspace id" on any call
#   present but wrong   -> resolves SILENTLY against another workspace's board
# Only a correct pin is safe. Never paste a "close enough" ID — a wrong one is
# the single failure nothing surfaces.

workspace_id = "90141509251"    # "The Vault" — the agentic-tools workspace.
                                # The API boundary, not a scope: see [work_sync].
# list_id    = ""    # optional: default target for `myclickup create`


# ---------------------------------------------------------------------------
# Below here is read by the ClickUp sync skills, not by myclickup itself.
# myclickup loads this file and ignores tables it does not know (config.py
# _read_pins), so these are forward-compatible today.
# ---------------------------------------------------------------------------

[work_sync]
# Which part of the workspace this repo draws work from. The queue is
# scope x status: `scope` says which lists to scan, `statuses.agent_ready`
# says which tasks in them are queued.
#   ["Space/Folder/List", ...]  a subsection
#   ["Space"]                   a whole Space
#   []                          the whole workspace
#
# [] on purpose: The Vault is dedicated to agentic tooling, so the whole
# workspace IS the scope. Narrow this only if it grows unrelated areas.
scope = []

queue = "Codebase/Agentic Conventions"   # where `Ready for Agent` is watched
# wip_limit = 3                          # max concurrently `Agent Working`

[statuses]
# Semantic role -> the status name as spelled in THIS workspace's Space.
# A mapping, not a list: status names vary per Space, which is the same
# reason completion is judged by status_type and never by name.
#
# MATCH CASE-INSENSITIVELY. ClickUp returns these lower-cased whatever the UI
# shows ("ready for agent"), so an exact match against the values below finds
# nothing. Observed 2026-08-11 on task 86bbc7we3.
agent_ready   = "Ready for Agent"
agent_working = "Agent Working"
human_active  = "In Progress"
review        = "In Review"
